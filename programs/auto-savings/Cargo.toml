[package]
name = "auto-savings"
version = "0.1.0"
description = "Solana Auto-Savings Protocol - Automatically save a percentage of every transfer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "auto_savings"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.29.0", default-features = false }
getrandom = "=0.2.15"

# ============================================================================
# DEPLOYMENT OPTIMIZATION - Reduces program size by 20-40%
# ============================================================================
[profile.release]
opt-level = "z"          # Maximize size reduction
lto = true               # Link-time optimization
codegen-units = 1        # Single codegen unit for better optimization
strip = true             # Remove debug symbols
panic = "abort"          # Smaller panic handler
overflow-checks = false  # No runtime overflow checks (save size)
